<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Sree Venkateswara Organics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f6f3;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #176b35;
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 8px 0 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #176b35;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #176b35;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f5127;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #ffe6e6;
            color: #b00020;
            padding: 11px;
            border-radius: 7px;
            text-align: center;
            margin-bottom: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #176b35;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🌱</div>

    <h1>Admin Login</h1>

    <div class="subtitle">
        Sree Venkateswara Organics
    </div>

    <div id="errorMessage" class="error"></div>

    <form id="loginForm">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Website
    </a>

</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const errorMessage = document.getElementById("errorMessage");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorMessage.style.display = "none";

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

        const response = await fetch("/api/admin-login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {

            window.location.href = "/admin";

        } else {

            errorMessage.textContent =
                data.message || "Invalid username or password.";

            errorMessage.style.display = "block";

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }

    } catch (error) {

        errorMessage.textContent =
            "Server connection failed. Make sure Flask is running.";

        errorMessage.style.display = "block";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }

});

</script>

</body>
</html>

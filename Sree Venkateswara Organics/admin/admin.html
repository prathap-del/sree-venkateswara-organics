<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Sree Venkateswara Organics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #222;
        }

        header {
            background: #176b35;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header p {
            margin: 7px 0 0;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh {
            background: #176b35;
            color: white;
        }

        .refresh:hover {
            background: #0f5127;
        }

        .logout {
            background: #b00020;
            color: white;
            margin-left: 8px;
        }

        .logout:hover {
            background: #850018;
        }

        .order-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 21px;
            font-weight: bold;
            color: #176b35;
        }

        .date {
            color: #666;
        }

        .customer {
            background: #f8faf8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .customer p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .products {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .products th,
        .products td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .products th {
            background: #eaf4ec;
        }

        .total {
            text-align: right;
            font-size: 21px;
            font-weight: bold;
            color: #176b35;
            margin-top: 15px;
        }

        .status-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .status-box {
            padding: 10px 14px;
            border-radius: 6px;
        }

        .payment-status {
            background: #ffe0e0;
        }

        .order-status {
            background: #fff3cd;
        }

        .loading {
            text-align: center;
            padding: 35px;
            background: white;
            border-radius: 10px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }

        .error {
            text-align: center;
            background: #ffe5e5;
            color: #b00020;
            padding: 30px;
            border-radius: 10px;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
            }

            header h1 {
                font-size: 22px;
            }

            .products {
                font-size: 13px;
            }

            .products th,
            .products td {
                padding: 7px;
            }

            .top-bar {
                align-items: stretch;
            }

            .top-bar > div {
                width: 100%;
            }

            .refresh,
            .logout {
                width: 100%;
                margin: 4px 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Sree Venkateswara Organics</h1>
    <p>Admin Order Dashboard</p>
</header>

<div class="container">

    <div class="top-bar">

        <h2>Customer Orders</h2>

        <div>
            <button class="refresh" onclick="loadOrders()">
                🔄 Refresh Orders
            </button>

            <button class="logout" onclick="logoutAdmin()">
                🚪 Logout
            </button>
        </div>

    </div>

    <div id="orders">
        <div class="loading">
            Loading orders...
        </div>
    </div>

</div>

<script>

async function loadOrders() {

    const ordersContainer = document.getElementById("orders");

    ordersContainer.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try {

        const response = await fetch("/api/orders", {
            method: "GET",
            credentials: "same-origin"
        });

        if (response.status === 401) {
            window.location.href = "/admin-login";
            return;
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(
                data.message || "Unable to load orders."
            );
        }

        if (!data.orders || data.orders.length === 0) {

            ordersContainer.innerHTML = `
                <div class="empty">
                    <h2>No Orders Yet</h2>
                    <p>Customer orders will appear here.</p>
                </div>
            `;

            return;
        }

        ordersContainer.innerHTML = "";

        data.orders.forEach(order => {

            let items = [];

            try {

                let itemText = order.items || "[]";

                itemText = itemText
                    .replace(/'/g, '"')
                    .replace(/None/g, 'null')
                    .replace(/True/g, 'true')
                    .replace(/False/g, 'false');

                items = JSON.parse(itemText);

            } catch (error) {

                console.log("Could not read order items:", error);

                items = [];

            }

            let productRows = "";

            if (Array.isArray(items)) {

                items.forEach(item => {

                    const name = item.name || "Product";

                    const price = Number(
                        item.price || 0
                    );

                    const quantity = Number(
                        item.quantity ||
                        item.qty ||
                        1
                    );

                    const subtotal =
                        price * quantity;

                    productRows += `
                        <tr>
                            <td>${escapeHTML(name)}</td>
                            <td>₹${price.toFixed(2)}</td>
                            <td>${quantity}</td>
                            <td>₹${subtotal.toFixed(2)}</td>
                        </tr>
                    `;

                });

            }

            if (!productRows) {

                productRows = `
                    <tr>
                        <td colspan="4">
                            Product details unavailable
                        </td>
                    </tr>
                `;

            }

            const card =
                document.createElement("div");

            card.className = "order-card";

            card.innerHTML = `

                <div class="order-header">

                    <div class="order-number">
                        Order #${order.id}
                    </div>

                    <div class="date">
                        ${escapeHTML(
                            order.created_at || ""
                        )}
                    </div>

                </div>

                <div class="customer">

                    <p>
                        <strong>Customer Name:</strong>
                        ${escapeHTML(
                            order.customer_name
                        )}
                    </p>

                    <p>
                        <strong>Mobile:</strong>
                        ${escapeHTML(
                            order.phone
                        )}
                    </p>

                    <p>
                        <strong>Delivery Address:</strong>
                        ${escapeHTML(
                            order.address
                        )}
                    </p>

                    <p>
                        <strong>Pincode:</strong>
                        ${escapeHTML(
                            order.pincode
                        )}
                    </p>

                </div>

                <h3>Ordered Products</h3>

                <table class="products">

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>

                    </thead>

                    <tbody>
                        ${productRows}
                    </tbody>

                </table>

                <div class="total">
                    Total:
                    ₹${Number(
                        order.total || 0
                    ).toFixed(2)}
                </div>

                <div class="status-row">

                    <div class="status-box payment-status">
                        💳 Payment:
                        <strong>
                            ${escapeHTML(
                                order.payment_status
                            )}
                        </strong>
                    </div>

                    <div class="status-box order-status">
                        📦 Order:
                        <strong>
                            ${escapeHTML(
                                order.order_status
                            )}
                        </strong>
                    </div>

                </div>
            `;

            ordersContainer.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        ordersContainer.innerHTML = `

            <div class="error">

                <h2>Unable to Load Orders</h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <button
                    class="refresh"
                    onclick="loadOrders()">
                    Try Again
                </button>

            </div>

        `;

    }

}


function logoutAdmin() {

    window.location.href =
        "/admin-logout";

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document.addEventListener(
    "DOMContentLoaded",
    loadOrders
);

</script>

</body>
</html>
